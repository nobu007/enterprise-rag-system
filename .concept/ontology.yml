# Canonical ontology (pruned 2026-09-13 to the kept modules)
version: '0.3'
canonical_terms:
  VectorDB:
    id: TERM-CORE-004
    layer: core
    status: stable
    definition: ベクトルDB 操作の抽象基底クラス（ABC）。connect/create_index/upsert/search/delete/get_stats
      を契約とし、Pinecone・FAISS 等が実装する。
    synonyms:
    - ベクトルデータベース
    boundaries:
      includes:
      - ベクトルの挿入・検索・削除の抽象IF
      excludes:
      - 具体的なバックエンド実装の詳細
    related_terms:
    - PineconeVectorDB
    - FAISSVectorDB
    - SearchResult
    - EmbeddingModel
    evidence:
    - source: app/core/vectordb.py#L30-L71
      quote: 'class VectorDB(ABC): """Abstract base class for vector database operations"""'
  EmbeddingModel:
    id: TERM-CORE-005
    layer: core
    status: stable
    definition: 埋め込みモデルの抽象基底クラス（ABC）。OpenAIEmbeddings / CohereEmbeddings 等が実装する。
    related_terms:
    - OpenAIEmbeddings
    - CohereEmbeddings
    - HybridRetriever
    evidence:
    - source: app/core/embeddings.py#L19-L20
      quote: 'class EmbeddingModel(ABC): """Abstract base class for embedding models"""'
  SearchResult:
    id: TERM-CORE-008
    layer: core
    status: stable
    definition: ベクトルDB 検索結果のデータクラス。id/score/metadata/text を持つ。
    related_terms:
    - VectorDB
    evidence:
    - source: app/core/vectordb.py#L21-L27
      quote: 'class SearchResult: """Search result from vector database"""'
  DocumentValidator:
    id: TERM-DOM-003
    layer: domain
    status: stable
    definition: 取り込み前の包括的ドキュメント検証。内容品質・PII検出・セキュリティ（XSS/SQLi/パストラバーサル）・フォーマット別検査を行い
      ValidationResult を返す。
    related_terms:
    - ValidationResult
    - ValidationError
    - SecurityValidator
    - Document
    evidence:
    - source: app/services/validator.py#L92-L95
      quote: 'class DocumentValidator: """Comprehensive document validator for RAG
        ingestion pipeline."""'
  DocumentParser:
    id: TERM-DOM-004
    layer: domain
    status: stable
    definition: 表やチャート参照の抽出・整形保持を行う拡張ドキュメントパーサ。
    related_terms:
    - ParsedContent
    - TableData
    - FormattingParser
    evidence:
    - source: app/services/parser.py#L129-L134
      quote: 'class DocumentParser: """Enhanced document parser with table and chart
        support."""'
  DocumentLoader:
    id: TERM-DOM-005
    layer: domain
    status: stable
    definition: ドキュメントローダの基底クラス。各種フォーマットから Document を生成し、TextSplitter で分割する。
    related_terms:
    - Document
    - TextSplitter
    - EnhancedDocumentLoader
    evidence:
    - source: app/services/document_loader.py#L92-L93
      quote: 'class DocumentLoader: """Base class for document loaders"""'
  EnhancedDocumentLoader:
    id: TERM-DOM-006
    layer: domain
    status: stable
    definition: 高度なパース機能を統合したドキュメントローダ。DocumentParser と協調する。
    related_terms:
    - DocumentLoader
    - DocumentParser
    evidence:
    - source: app/services/document_loader_enhanced.py#L24
      quote: 'class EnhancedDocumentLoader: """Enhanced document loader with parsing
        capabilities"""'
  Document:
    id: TERM-DOM-007
    layer: domain
    status: stable
    definition: ドキュメント表現。内容(content)・メタデータ・ソース等を保持し、取得・検証・パース対象となる。
    related_terms:
    - DocumentLoader
    - HybridRetriever
    - DocumentValidator
    evidence:
    - source: app/services/document_loader.py#L20-L21
      quote: 'class Document: """Document representation"""'
  Settings:
    id: TERM-AUX-001
    layer: aux
    status: stable
    definition: Pydantic BaseSettings によるアプリ設定。全設定を環境変数から取得し（シークレットのハードコード禁止）、APIキー・検索・キャッシュ・DB・レートリミット等を一元管理する。
    related_terms:
    - CacheManager
    - DatabasePool
    - ConcurrencyLimiter
    evidence:
    - source: app/core/config.py#L13-L14
      quote: 'class Settings(BaseSettings): """Application settings with environment
        variable support"""'
