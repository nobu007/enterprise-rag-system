conflicts:
  - id: "CFLT-VECTORDB-001"
    term: "VectorDB"
    about: "backend_coverage"
    severity: "medium"
    nli: "contradiction"
    items:
      - claim: "README とモジュール docstring は Weaviate をサポートベクタストアとして挙げ、requirements.txt も weaviate-client を依存に持つ"
        source: "doc:README.md#L1336 ('| Vector Store | Pinecone, Weaviate, FAISS |') / doc:app/core/vectordb.py#L5 ('supporting Pinecone, Weaviate, and FAISS') / dep:requirements.txt#L18 (weaviate-client==3.26.0)"
      - claim: "実装は PineconeVectorDB(L74) と FAISSVectorDB(L198) のみ。WeaviateVectorDB クラスは存在しない"
        source: "code:app/core/vectordb.py#L74-L198 (concrete subclasses: PineconeVectorDB, FAISSVectorDB only)"
    status: "open"
    active_workaround:
      decision_key: "AUTO:VectorDB.backend_coverage:implemented_only"
      summary: "コード実装を正(Truth)とし、VectorDB の concrete バックエンドは Pinecone+FAISS のみと扱う。ontology/mappings は既に実装側を反映済み。README/docstring/依存の Weaviate 記述は aspirational(未実装) として本矛盾に記録し、解決は docs 修正または Weaviate 実装に委ねる（概念整備のスコープ外）。"

  - id: "CFLT-DRG-001"
    term: "Document"
    about: "feature_existence"
    severity: "medium"
    nli: "contradiction"
    items:
      - claim: "README は Document Relationship Graph を計画中の機能として説明し、relationship endpoints は未提供と明記する"
        source: "doc:README.md#L81 ('planned; relationship endpoints are not available yet') / doc:README.md#L1097-L1102 (placeholder router と未実装を明記)"
      - claim: "app/ 内に NetworkX import や relationship graph の実装はなく、relationships.py は空の placeholder router のみ。requirements.txt にも networkx は無い"
        source: "code:app/api/routes/relationships.py (router = APIRouter() のみ) / code:app/ (NetworkX import なし) / dep:requirements.txt (networkx 欠落)"
    status: "resolved"
    resolution: "解決済 (2026-09-12): README の機能説明と API 例を削除し、relationship graph は計画中、/api/v1/relationships router は placeholder で未提供と同期。tests/unit/test_api_docs.py の回帰テストで README と OpenAPI に未実装 endpoint を再掲載しないことを検証する。"

  - id: "CFLT-AUDIT-001"
    term: "Tenant"
    about: "feature_existence"
    severity: "medium"
    nli: "contradiction"
    items:
      - claim: "README は監査ログ(Audit logging)を機能として挙げ、テナント毎の監査ログ・テナント活動の監視まで謳う"
        source: "doc:README.md#L72 ('Audit logging') / doc:README.md#L1066 ('Audit logging per tenant') / doc:README.md#L1286 ('Monitor tenant activity through audit logs')"
      - claim: "app/ 内に audit/access log/event log 実装は一切存在しない（middleware は Validation/Tenant/RequestID の3つのみ。role のヒットは LLM メッセージ role であり RBAC ではない）"
        source: "code:app/ (grep audit|access.?log|event.?log -> 0 件) / code:app/middleware/ (validation.py, tenant.py, request_id.py のみ)"
    status: "open"
    active_workaround:
      decision_key: "AUTO:AuditLogging.feature_existence:unimplemented"
      summary: "コード実装を正とし、監査ログ機能は未実装(README のみ)と扱う。概念辞書に term を追加しない(実装根拠がないため Rule 1/4)。解決は監査ログ実装または README 修正に委ねる（概念整備のスコープ外）。"

  - id: "CFLT-DOCS-001"
    term: "Document"
    about: "route_registration"
    severity: "high"
    nli: "contradiction"
    items:
      - claim: "documents ルータは実装され routes/__init__.py でエクスポートされ、5エンドポイント(/documents/ingest, /upload, /stats, /batch, /batch/{task_id}/status)を持つ。main.py の docstring と README はこれらを稼働中のレート制限付きエンドポイントとして説明する"
        source: "code:app/api/routes/documents.py#L20 (router = APIRouter(prefix=\"/documents\", ...)) / code:app/api/routes/documents.py#L86,L255,L406,L464,L611 (5 routes) / code:app/api/routes/__init__.py#L5,L7 (exports documents) / doc:app/main.py#L139 ('/api/v1/documents/ingest endpoint: 20 requests/minute')"
      - claim: "main.py は documents ルータを import も include_router もしない。取り込まれているのは health/query/ingest の3ルータのみ。/documents/* エンドポイントは到達不能なデッドコード。いかなるテストも /documents 経路を検証しない"
        source: "code:app/main.py#L24 ('from app.api.routes import query, health, ingest' — documents 無し) / code:app/main.py#L246-L248 (include_router は health/query/ingest のみ) / tests/ (grep 'documents/' -> 0 件)"
    status: "resolved"
    resolution: "解決済 (2026-09-11): app/main.py が documents ルータを import し、prefix='/api/v1' で include_router するよう修正。tests/unit/test_api_docs.py に OpenAPI の /api/v1/documents/ingest 登録回帰テストを追加した。app/main.py と documents.py の py_compile は通過。pytest は実行環境の fastapi が namespace package で FastAPI を提供しないため、対象テストの実行を保留している。"

  - id: "CFLT-APIPATH-001"
    term: "QueryRequest"
    about: "api_path_contract"
    severity: "low"
    nli: "contradiction"
    items:
      - claim: "README の API 例と mappings.yml はクエリエンドポイントを '/query' と表記する"
        source: "history:bbb2dcf^:README.md#L88-L91 / history:pre-2026-09-12:.concept/mappings.yml (旧ドキュメントと旧マッピング)"
      - claim: "実際のパスは '/api/v1/query/' (main.py prefix '/api/v1' + query router prefix '/query' + route '/')。batch は '/api/v1/query/batch'、stream は '/api/v1/query/stream'。main.py 自身の docstring も '/api/v1/query/' を正として記載"
        source: "code:app/api/routes/query.py#L23 (router = APIRouter(prefix=\"/query\", ...)) / code:app/main.py#L247 (include_router prefix=\"/api/v1\") / doc:app/main.py#L137 ('/api/v1/query/ endpoint: 60 requests/minute')"
    status: "resolved"
    resolution: "解決済 (2026-09-12): 実際のマウントパスを正として mappings.yml の API 対応を /api/v1/query/{,batch,stream} に更新し、README・ルート docstring・OpenAPI description のストリーミング例を POST JSON 契約へ同期。tests/unit/test_api_docs.py の契約テストで再発を検出する。"

  - id: "CFLT-SCHEMA-001"
    term: "RetrievalResult"
    about: "dataclass_field_contract"
    severity: "medium"
    nli: "contradiction"
    items:
      - claim: "RetrievalResult は4フィールド(document/score/metadata/source)すべてが必須の @dataclass で、デフォルト値なし。プロダクションコードは3箇所すべてで source を供給する（metadata.get('source','unknown')）。ontology TERM-CORE-007 の定義もこれに一致する"
        source: "code:app/services/retrieval.py#L18-L24 ('@dataclass class RetrievalResult: document: str / score: float / metadata: Dict / source: str' — デフォルト無し) / code:app/services/retrieval.py#L173-L178, #L197-L202 (source= を供給) / code:app/api/routes/query.py#L435-L440 (source= を供給) / concept:.concept/ontology.yml RetrievalResult#L85-L93"
      - claim: "統合テスト test_context_compression と test_confidence_calculation は RetrievalResult を source 省略で3箇所(L152,L157,L248)で構築する。source は必須引数のため構築時に TypeError となり、両テストは収集/実行時に失敗する。これは MET-003(pytest 全件パス) と MS-004 受入(統合テスト) を阻害する"
        source: "code:tests/integration/test_rag_integration.py#L152-L161 (test_context_compression, 2件 source 省略) / code:tests/integration/test_rag_integration.py#L248-L253 (test_confidence_calculation, source 省略) / 実行証拠: pytest -> 'TypeError: RetrievalResult.__init__() missing 1 required positional argument: source' at L152 and L248 (2026-07-27 実測, mise py3.13)"
    status: "resolved"
    resolution: "解決済 (2026-08-07): 3サイトの stale な RetrievalResult 構築へ source= 引数を追加（tests/integration/test_rag_integration.py: test_context_compression x2, test_confidence_calculation x1）。mise py3.13 で両テストの source TypeError 解消を確認（単独実行 2 passed）。フルスイートでは test_confidence_calculation が別件の既存バグ（別テストの numpy mock leak → faiss import 失敗）で失敗するが、本矛盾とは無関係。"
    active_workaround:
      decision_key: "AUTO:RetrievalResult.dataclass_field_contract:code_is_truth_tests_stale"
      summary: "コード(dataclass 定義と3つのプロダクション構築サイト)を Truth とし、ontology TERM-CORE-007(4必須フィールド)は正確と扱う。統合テスト3箇所は source フィールド追加前に書かれた stale なテストと判定。本矛盾として記録し、解決は該当3サイトへ source= 引数を追加するテスト修正に委ねる（実コード/テスト変更は概念整備のスコープ外、過去6サイクルの code_changed_since_bootstrap=false 前例に従う）。"

