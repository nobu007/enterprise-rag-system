[pytest]
# Pytest configuration for Enterprise RAG System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external services)
    slow: Slow running tests
    api: API endpoint tests

# Coverage options (when using pytest-cov)
# addopts = --cov=app --cov-report=html --cov-report=term

# Minimum version
minversion = 7.0

# Asyncio mode
asyncio_mode = auto
# pytest-asyncio >=0.23: explicit default loop scope for async fixtures.
# Set to suppress the PytestDeprecationWarning ("asyncio_default_fixture_loop_scope is unset")
# and to match the future default. Safe here: the suite has no async fixtures, so this only
# governs the (currently unused) async-fixture loop scope.
asyncio_default_fixture_loop_scope = function

# Log options (optional, for debugging)
# log_cli = true
# log_cli_level = INFO
