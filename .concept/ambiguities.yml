    auto_decision: "テナント API-key 認証のみ実装済み、ロールベース認可(RBAC)は未実装(README は aspirational)と扱う。概念辞書に Auth 用語を追加せず、tenant 既存 term 配下の部分実装として記録。解決は認可実装または README 修正に委ねる（概念整備のスコープ外）。"
    confidence: 0.6
